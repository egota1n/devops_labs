name: CI

on:
  push:
    branches: [ lab3 ]
  pull_request:
    branches: [ lab3 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.stats()'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Wait for MongoDB
        run: |
          until nc -z localhost 27017; do
            echo "Waiting for MongoDB..."
            sleep 2
          done

      - name: Start server for testing
        run: node app.js &
        working-directory: server
        env:
          MONGODB_URI: mongodb://localhost:27017/taskmanager_test
          PORT: 3303

      - name: Wait for server
        run: sleep 5

      - name: Run server tests
        run: npm test
        working-directory: server
        env:
          NODE_ENV: test

      - name: Run client tests
        run: npm test
        working-directory: client

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Docker image tag
        run: echo "TAG=$(date +%Y.%m.%d)-${GITHUB_SHA::7}" >> docker-images.env

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        run: |
          source docker-images.env
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/devops_labs-backend:${TAG} server
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops_labs-backend:${TAG}
          echo "BACKEND_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/devops_labs-backend:${TAG}" >> docker-images.env

      - name: Build & push frontend image
        run: |
          source docker-images.env
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/devops_labs-frontend:${TAG} client
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops_labs-frontend:${TAG}
          echo "FRONTEND_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/devops_labs-frontend:${TAG}" >> docker-images.env

      - name: Upload image info
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: docker-images.env

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image info
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: .

      - name: Load env
        run: cat docker-images.env >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.VM_IP }} >> ~/.ssh/known_hosts

      - name: Run Ansible playbook
        run: |
          ansible-playbook \
            -i infrastructure/ansible/inventory.yml infrastructure/ansible/deploy_app_kubernetes.yml \
            --extra-vars "backend_image=${{ env.BACKEND_IMAGE }} frontend_image=${{ env.FRONTEND_IMAGE }}"